# ══════════════════════════════════════════════════════════════
# PHASE 0: Kickoff — Virtual Focus Group (Design Review Simulation)
#
# Note: WI content is read as-is (input data — could be any language).
# All system instructions and agent output are in English.
# Decision tokens (APPROVE/IMPROVE/INSUFFICIENT/CHANGES_REQUIRED/PASS/FAIL)
# are pipeline-critical — Python regex depends on them.
# ══════════════════════════════════════════════════════════════

kickoff_sm_open_task:
  description: >
    TASK: Open the "Virtual Focus Group" meeting for work item #{work_item_id}.
    You are the moderator running the meeting.

    Use "get_work_item" to read the work item.
    Present it to the team: title, description, acceptance criteria and comments.
    If there are comments, include them — they may carry context, decision
    history or change requests.

    MEETING STRUCTURE:
    Four experts each raise 3 critical questions/concerns from their own
    perspective, then respond to each other. Finally a "Critical Design
    Review" minutes will be produced.

    EXPERTS:
    - Analyst (Deniz): Business rules, logical gaps, UX — dislikes ambiguity
    - Developer (Baris): How to code it, complexity, tech fit, tech-debt risk
    - Team Lead (Can): Schedule, team capacity, integrations — pragmatic balancer
    - QA/Tester (Ece): Failure scenarios, "where does this blow up?", testability

    PREVIOUS CONTEXT:
    {previous_context}
  expected_output: >
    ## Virtual Focus Group — Opening

    **Work Item:** #{work_item_id}
    **Title:** [title]
    **Summary:** [1-2 sentences]
    **Existing Acceptance Criteria:** [list from WI, "Undefined" if missing]
    **Comments:** [author + content if any, else "No comments"]
    **Agenda:** Experts will share 3 critical questions/concerns each, then cross-discuss.
  agent: scrum_master

kickoff_ba_task:
  description: >
    TASK: Take the Analyst (Deniz) persona. Contribute to the focus group.

    Focus on business rules, logical gaps and user experience. You dislike
    ambiguity — flag every unclear point.

    WORK ITEM CONTEXT:
    {previous_context}

    STEP 1 — 3 CRITICAL QUESTIONS/CONCERNS (as Deniz):
    Based on the work item info above, raise the 3 points that concern you most:
    a) Which business rule is unclear or missing? (e.g. "in case X should it do Y or Z?")
    b) Which logical gap exists? (e.g. "edge cases undefined")
    c) How is UX affected? Backwards compatibility?

    STEP 2 — ANSWER WHAT CAN BE ANSWERED FROM THE WI:
    For each question, answer using the WI info. Unanswerable → mark as "OPEN QUESTION".

    STEP 3 — VALIDATE ACCEPTANCE CRITERIA:
    Are the acceptance criteria measurable and testable?
    If any is missing or vague, propose a concrete, measurable version.

    WORK ITEM: #{work_item_id}
  expected_output: >
    ## Analyst (Deniz) — Perspective

    **3 Critical Questions/Concerns:**
    1. [Concern] — [answer from WI or "OPEN QUESTION"]
    2. [Concern] — [answer from WI or "OPEN QUESTION"]
    3. [Concern] — [answer from WI or "OPEN QUESTION"]

    **Deniz's Assessment of Acceptance Criteria:**
    - [Criterion 1]: Measurable / Vague — [suggestion]
    - [Criterion 2]: Measurable / Vague — [suggestion]

    **Open Questions:** [list or "None"]
    **Suggested Additional Acceptance Criteria:** [list or "None"]
  agent: business_analyst

kickoff_arch_task:
  description: >
    TASK: Take the Team Lead (Can) persona. Contribute to the focus group.

    Look at schedule, team capacity and integration risks with other systems.
    You are a pragmatic balancer — defend the feasible, not the ideal.
    WI context and other experts' contributions will be supplied in each sub-call.

    NOTE: This agent's output is produced section-by-section by the pipeline
    (kickoff_sections.SECTION_PLANS["kickoff_arch_task"]). In each sub-call
    you produce only ONE section — the sub-call prompt will tell you which
    section and its format.

    WORK ITEM: #{work_item_id}
  expected_output: >
    ## Team Lead (Can) — Perspective

    **Response to Deniz's Concerns:**
    - [question 1]: [agree/disagree + one sentence]
    - [question 2]: [agree/disagree + one sentence]

    **3 Critical Questions/Concerns:**
    1. [integration risk — one sentence]
    2. [coordination — one sentence]
    3. [scope — one sentence]

    **Estimated Affected Repo/Module:** [name/path or "Unclear"]
    **Integration Risks:**
    - [risk 1 — one sentence]
    - [risk 2 — one sentence]
    **Scope Boundary Suggestion:** [one-sentence clear boundary]
  agent: software_architect

kickoff_dev_task:
  description: >
    TASK: Take the Developer (Baris) persona. Contribute to the focus group.

    You look at "how do we code it?" Focus on complexity, tech fit and
    tech-debt risk. WI context and other experts' contributions will be
    supplied in each sub-call.

    NOTE: This agent's output is produced section-by-section by the pipeline
    (kickoff_sections.SECTION_PLANS["kickoff_dev_task"]). In each sub-call
    you produce only ONE section — the sub-call prompt will tell you which
    section and its format.

    WORK ITEM: #{work_item_id}
  expected_output: >
    ## Developer (Baris) — Perspective

    **Response to Deniz and Can:**
    - [point 1]: [one sentence]
    - [point 2]: [one sentence]

    **3 Critical Questions/Concerns:**
    1. [code fit / refactor risk — one sentence]
    2. [edge cases — one sentence]
    3. [tech debt risk — one sentence]

    **Complexity:** Low/Medium/High — [one-sentence rationale]

    **Code Points to Watch:**
    - [file:function 1]
    - [file:function 2]
    - [file:function 3]

    **Suggested Technical Approach:**
    1. [step — one sentence]
    2. [step — one sentence]
    3. [step — one sentence]
  agent: senior_developer

kickoff_qa_task:
  description: >
    TASK: Take the QA/Tester (Ece) persona. Contribute to the focus group.

    You think in failure scenarios. Ask "where does this blow up?" and
    "how do we test it?".

    STEP 1 — Evaluate the team's concerns from a testing perspective:
    Deniz's logical gaps, Can's integration risks and Baris's edge cases —
    how do they look from QA's eye? Are they testable?

    STEP 2 — 3 CRITICAL QUESTIONS/CONCERNS (as Ece):
    a) Which negative scenario (failure path), untested, creates production risk?
    b) Could this change break existing features? Where is regression risk?
    c) Is performance/load testing needed? Which thresholds matter?

    STEP 3 — TEST SCENARIOS:
    List the essential test scenarios to be developed (happy path + failure paths).

    WORK ITEM: #{work_item_id}
  expected_output: >
    ## QA/Tester (Ece) — Perspective

    **Testability of Team's Concerns:**
    - Deniz's [gap]: Testable / Untestable — [explanation]
    - Can's [risk]: Testable / Untestable — [explanation]
    - Baris's [edge case]: Test scenario: [explanation]

    **3 Critical Questions/Concerns:**
    1. [Critical negative scenario]
    2. [Regression risk]
    3. [Performance/load concern]

    **Essential Test Scenarios:**
    - [ ] Happy path: [explanation]
    - [ ] Failure path 1: [explanation]
    - [ ] Failure path 2: [explanation]
    - [ ] Edge case: [explanation]

    **Regression Risk:** Low / Medium / High
  agent: qa_engineer

kickoff_uat_task:
  description: >
    TASK: As UAT Specialist, evaluate end-user acceptance.

    Considering all team perspectives (Deniz/Can/Baris/Ece), evaluate from
    UAT angle.

    - Are acceptance criteria testable from end-user perspective?
    - Which acceptance criteria might be "technically correct but business
      incorrect"?
    - Flag points with business rule violation risk.

    WORK ITEM: #{work_item_id}
  expected_output: >
    ## UAT Perspective

    **End-User Evaluation of Acceptance Criteria:**
    - [Criterion 1]: Testable in UAT / Untestable — [explanation]

    **Business Rule Risks:** [list or "None"]
    **End-User Impact:** [explanation]
  agent: uat_specialist

kickoff_sm_close_task:
  description: >
    TASK: Close the focus group meeting. Prepare the "Critical Design Review"
    minutes.

    Aggregate all experts' (Deniz/Can/Baris/Ece) contributions. This minutes
    document is the single reference source for the rest of the pipeline.
    WI context and other experts' contributions will be supplied in each
    sub-call.

    NOTE: This agent's output is produced section-by-section by the pipeline
    (kickoff_sections.SECTION_PLANS["kickoff_sm_close_task"]). In each sub-call
    you produce only ONE section (in production order 4 → 3 → 2 → 1, but
    rendered 1 → 4 for display). The sub-call prompt tells you which section
    and its format.

    WORK ITEM: #{work_item_id}
  expected_output: >
    ## Critical Design Review — Minutes

    **Work Item:** #{work_item_id}

    ### 1. Meeting Summary
    [Overall feasibility assessment, team consensus, scope boundary]

    ### 2. Per-Discipline Analysis
    **Analysis (Deniz):** [main findings]
    **Software (Baris):** [technical approach + warnings]
    **Management (Can):** [integration/scope decisions]
    **Testing (Ece):** [critical test scenarios]

    ### 3. Critical Risk Table
    | Risk | Impact | Mitigation |
    |------|--------|------------|
    | [risk 1] | High/Medium/Low | [mitigation] |
    | [risk 2] | High/Medium/Low | [mitigation] |

    ### 4. Backlog Candidates
    **Final Acceptance Criteria:**
    - [ ] [Criterion 1 — measurable, testable]
    - [ ] [Criterion 2 — measurable, testable]

    **Edge Cases the Technical Design Must Address:**
    - [edge case 1]
    - [edge case 2]

    **Open Tasks / Stories:**
    - [if any]

    *The whole team is ready for work item #{work_item_id}.*
  agent: scrum_master

# ══════════════════════════════════════════════════════════════
# PHASE 0: Scrum Master — Repo Discovery and Dependency Analysis
# ══════════════════════════════════════════════════════════════

discover_repos_task:
  description: >
    TASK: Discover the relevant Azure DevOps repositories for work item
    {work_item_id}. Use "list_repos" to list all repos in the project.
    Based on the work item info, identify which repo(s) will be worked on.

    PREVIOUS STEP OUTPUTS:
    {previous_context}
  expected_output: >
    List of discovered repos and the name of the repo(s) related to the work item.
  agent: software_architect

dependency_analysis_task:
  description: >
    TASK: Inspect the structure of the identified repo(s).
    Use "browse_repo" to analyze directory layout, main files and
    dependencies (imports, config files).

    PREVIOUS STEP OUTPUTS:
    {previous_context}
  expected_output: >
    Repo structure summary, language/framework used and dependency map.
  agent: software_architect

# ══════════════════════════════════════════════════════════════
# PHASE 1: Requirements Analysis and Technical Design
# ══════════════════════════════════════════════════════════════

requirements_analysis_task:
  description: >
    TASK: Analyze work item {work_item_id} and produce structured JSON output.

    The work item info is ready under a "WORK ITEM DETAIL" heading in
    context. Read and analyze. You may also use get_work_item — but if it's
    already in context, do not re-read.

    WORKFLOW:
    1. Read the WI title + description + acceptance criteria
    2. Extract functional requirements (FR1, FR2, ...)
    3. Extract technical requirements (TR1, TR2, ...)
    4. Number the acceptance criteria (AC1, AC2, ...)
    5. Identify out-of-scope items
    6. Mark assumptions with "ASSUMPTION:" prefix
    7. Add ambiguous points to open_questions

    IMPORTANT: If previous context contains a "Kickoff Meeting Summary", take
    it into account. If PR comments are present, reflect them in requirements.

    Complete the analysis in every case — work with whatever info is available.

    {scrum_master_feedback}

    PREVIOUS STEP OUTPUTS:
    {previous_context}
  expected_output: >
    Return ONLY valid JSON. NO free text outside the JSON.

    ```json
    {
      "summary": "one-sentence summary of the work item",
      "functional_requirements": [
        {"id": "FR1", "desc": "..."},
        {"id": "FR2", "desc": "..."}
      ],
      "technical_requirements": [
        {"id": "TR1", "desc": "..."}
      ],
      "acceptance_criteria": [
        {"id": "AC1", "desc": "..."},
        {"id": "AC2", "desc": "..."}
      ],
      "out_of_scope": ["..."],
      "assumptions": ["ASSUMPTION: ..."],
      "open_questions": ["..."]
    }
    ```

    RULES:
    - Every FR/TR/AC gets a unique id
    - DO NOT INVENT anything not in the description
    - Add missing info to open_questions
    - NO text outside the JSON
  agent: business_analyst

technical_design_task:
  description: >
    TASK: Produce a development plan for Azure DevOps work item #{work_item_id}.

    ⚠️ CRITICAL: Your FINAL output MUST be a JSON plan (with work_item_id,
    repo_name, summary, changes[], acceptance_criteria fields). AFTER you
    finish all tool calls, produce the JSON from gathered info. NEVER write
    a tool call format as "final answer".

    🚨 INSUFFICIENCY CHECK (from a code-writing perspective):
    If the work item is INSUFFICIENT FOR SOFTWARE DEVELOPMENT, instead of
    JSON, write this marker at the very start of your output:

    INSUFFICIENT: <briefly list the critical missing info from a developer's view>

    Valid reasons to say INSUFFICIENT:
    - What functionality changes is unclear (even after agent inspected repo)
    - Expected input/output, data structure or API contract unknown
    - Even guessing which files change is impossible
    - Acceptance criteria are not testable (not measurable)
    - Business rule or flow not described (including edge cases)
    - Despite using tools, you cannot find sufficient technical context

    NOT INSUFFICIENT (guess/discover these):
    - Repo name: discover with tools
    - Exact file path: search the codebase
    - Small ambiguities: continue with the most reasonable assumption

    If NOT INSUFFICIENT, produce the JSON DIRECTLY without any marker.

    ⚡ COST OPTIMIZATION — TOOL USAGE:
    The following info is READY in context:
    - "WORK ITEM DETAIL" heading: title, description, acceptance criteria
    - "FILE CONTENT: /path/file.php" heading: file contents (if any)
    - "Kickoff Meeting Summary" heading: team analysis
    - "SUGGESTED REPOS" heading: target repo

    RULE: For info already in context, DO NOT CALL ANY TOOL.
    - DO NOT call get_work_item — WI detail is already in context
    - DO NOT call browse_repo if file is in context — file contents already present
    - DO NOT call list_repos if repo is known

    Use tools ONLY for info NOT in context:
    - To read a file not in context → browse_repo
    - To search code → search_code

    STEP 1 — UNDERSTAND THE ACCEPTANCE CRITERIA:
    If context has an "Acceptance Criteria" heading, read and note it.
    These were set by BA and the technical plan MUST cover each one.
    The plan's `acceptance_criteria` JSON field must mirror this list exactly.

    STEP 2 — UNDERSTAND THE WORK ITEM:
    Read the "WORK ITEM DETAIL" section in context. Determine:
    - Which repository to work on. If context has a "Discover Repo Onerisi
      (Advisory)" section, treat it as input — review the rationale and the
      candidate summaries in "Repo Ozetleri". You are the final decision
      maker on `repo_name`: agree with the advisory if it fits, or pick a
      different repo if the evidence (tables, models, file ownership)
      points elsewhere. Always justify your choice with concrete evidence
      from the summaries.
    - What is being asked (translate, refactor, new endpoint, fix, etc.)
    - Which file/endpoint/route will change
    - Note any example file or pattern reference

    STEP 3 — FIND THE FILE TO CHANGE:
    If context has "FILE CONTENT: /path/file.php", use it.
    Otherwise find and read the target file with browse_repo.

    STEP 4 — READ THE EXAMPLE FILE (if any and not in context):
    If the description references an example file/pattern and it's not in
    context, read it. Understand the pattern — you'll apply the same shape
    to the target file.

    STEP 5 — WRITE THE CHANGE PLAN:
    Produce JSON in the format below.
    For EACH file, SHOW the current code and the new code.
    No guessing — base the plan only on the code you read.

    IMPORTANT:
    - Only plan the changes asked by the work item
    - DO NOT TOUCH files/modules NOT MENTIONED in the work item
    - DO READ every file you reference — do not guess
    - Adapt the example pattern to the target file; do not copy verbatim
    - ⛔ NO PLACEHOLDER TOKENS in `file_path`, `current_code`, or `new_code`.
      Concretize every token at generation time:
      - Migration timestamps → emit the real UTC value as a 14-digit
        string YYYYMMDDHHMMSS (example: 20260604123045). Do NOT leave
        the word TIMESTAMP, DATE, or XX patterns inside the filename or
        class name.
      - Class names, table names, column names → use the actual values
        from the work item. Do NOT leave generic words like ClassName,
        TABLE, COLUMN, TBD, TODO inside any output field.
      - If you genuinely do not know a concrete value, OMIT that change
        entirely (don't ship a half-defined plan). A change with an
        unfilled token will be rejected by validation and dropped from
        the PR.

    {scrum_master_feedback}

    PREVIOUS STEP OUTPUTS:
    {previous_context}
  expected_output: >
    Return your output STRICTLY in the JSON format below.
    NO EXPLANATION outside the JSON.

    ```json
    {
      "work_item_id": "{work_item_id}",
      "repo_name": "repository-name",
      "summary": "one-sentence summary of the work item",
      "changes": [
        {
          "file_path": "/full/file/path.php",
          "change_type": "edit",
          "description": "What changes in this file (one sentence)",
          "current_code": "EXISTING code block read from the file",
          "new_code": "NEW code block to apply",
          "covers_requirements": ["FR1", "AC2"],
          "risk": "low"
        }
      ],
      "acceptance_criteria": [
        {"id": "AC1", "desc": "criterion 1"},
        {"id": "AC2", "desc": "criterion 2"}
      ],
      "alternatives_considered": [
        {"option": "...", "tradeoff": "...", "chosen": true}
      ],
      "breaking_changes": [],
      "migration_notes": "",
      "security_perf_notes": ""
    }
    ```

    RULES:
    - `current_code` MUST be read from the real file, not invented
    - `new_code` MUST be compilable/runnable
    - Each change MUST link to at least one FR/TR/AC id (covers_requirements)
    - DO NOT write changes with empty covers_requirements
    - Include only the changes the WI asks for
    - `acceptance_criteria` must align with BA's AC list
    - `file_path` FORMAT: repo-relative absolute path, MUST start with `/`.
      Do NOT prepend the repo name (it lives in `repo_name`). Examples:
      - GOOD: `/app/Controller/Api/V1/Meta.php`
      - GOOD: `/database/Migrations/20260605120000_AddX.php`
      - BAD: `webservice/app/Controller/Api/V1/Meta.php` (repo name in path)
      - BAD: `app/Controller/Api/V1/Meta.php` (missing leading slash)
      - BAD: `./app/Controller/Api/V1/Meta.php` (dot-relative)
  agent: software_architect

# ══════════════════════════════════════════════════════════════
# PHASE 2: Developer — Code Writing
# ══════════════════════════════════════════════════════════════

implement_change_task:
  description: >
    TASK: Apply the change plan below EXACTLY. Your output is the FULL FILE
    WITH THE CHANGE APPLIED — every line from start to end.

    ╔══════════════════════════════════════════════════════════════╗
    ║ CRITICAL: FULL-FILE CONTRACT                                 ║
    ║                                                              ║
    ║ Your entire output is WRITTEN DIRECTLY to the file. From     ║
    ║ the moment of push, file == your output. A missing character ║
    ║ BREAKS the production system.                                ║
    ║                                                              ║
    ║ ORIGINAL_LINES -> NEW_LINES                                  ║
    ║ Acceptable range: NEW_LINES = ORIGINAL_LINES ± 30%           ║
    ║ Outside this range output is REJECTED before push and the    ║
    ║ pipeline must retry.                                         ║
    ╚══════════════════════════════════════════════════════════════╝

    NOTE: When the pipeline gives change_description containing "ONLY NEW
    CODE BLOCK", switch to BLOCK MODE — output only the replacement block
    (Python side handles integration). Default mode is FULL FILE unless
    told otherwise.

    ⚠️ APPLY TO ALL OCCURRENCES: the same logic may appear in MULTIPLE code
    paths/branches in this file (e.g. a new-API branch AND a legacy branch,
    or several version checks). Apply the change to EVERY relevant occurrence
    — not just the first. If you have repo tools, grep the file for the
    pattern first to find every spot. Leaving one path unchanged fails review.

    PLAN:
    Repo: {target_repo}
    File: {target_file}
    Change: {change_description}

    FULL PLAN AND OTHER FILES (for integration reference):
    {previous_context}

    CURRENT CODE (from plan — block present in file):
    ```
    {current_code}
    ```

    NEW CODE (from plan — block to replace the above):
    ```
    {new_code}
    ```

    MANDATORY STEPS (order is fixed):

    STEP 1 — READ THE FILE END-TO-END:
    Use "browse_repo" to read {target_file}. Get the full content from
    the FIRST line to the LAST. Even for medium/large files, request the
    whole thing.

    STEP 2 — MEASURE THE FILE MENTALLY:
    Keep in mind:
      ORIG_LINES = <original file line count>
      Plan delta: +<added> / -<removed> lines
      EXPECTED_NEW_LINES = ORIG_LINES + added - removed

    STEP 3 — APPLY THE CHANGE (SURGICAL):
    Find the plan's `current_code` block in the file, replace with `new_code`.
    Do NOT touch any other line — formatting, naming, comments, import
    order, whitespace remain UNCHANGED. Smallest blast radius: change ONLY
    what the plan requires, nothing adjacent. Do NOT refactor, rename, or
    reformat surrounding code even if it looks improvable. Do NOT add
    task-tied comments (e.g. "// added for WI", "# new column"); the edit
    must read as if the original author wrote it. Match the exact
    surrounding style (indent, quotes, trailing commas, brace placement).

    STEP 4 — RETURN THE FULL FILE:
    Output the file from its REAL FIRST LINE (e.g. PHP: "<?php") to its
    REAL LAST LINE, as a single code block. Skip nothing.

    STEP 5 — SELF-CHECK (while producing output):
    Before returning, ask yourself:
      [ ] Does output start with the file's real first line? (e.g. <?php)
      [ ] Does output end with the file's real last line?
      [ ] Is output line count close to EXPECTED_NEW_LINES?
      [ ] NO "..." or "// (rest unchanged)" abbreviation markers?
      [ ] NO out-of-plan changes?
    If ANY answer is "NO" — DO NOT RETURN, regenerate.

    ABSOLUTE PROHIBITIONS:
    - "..." / "// rest of code is the same" / "/* original code */" abbreviations
    - Returning only the changed method/function (if file has multiple
      methods, rewrite all of them as-is)
    - Touching files not in the plan
    - Deleting existing imports/namespaces
    - Any explanation outside the code block, e.g. "Here is the updated file:"
    - Producing code without reading the file

    LARGE FILE WARNING (>500 lines):
    Do not skip with "presumably the same". Carefully copy the original
    code + apply only the plan's change. Your max_tokens is sufficient;
    if not, return the full file and stop with an error message — DO NOT
    produce partial output.
  expected_output: >
    Return the FULL FILE WITH THE CHANGE APPLIED in a single code block.

    STRICT RULES:
    - Output STARTS with the file's first line (e.g. <?php, package main,
      from xyz import, etc.)
    - Output ENDS with the file's last line (closing tag, last function
      close, etc.)
    - Output line count is %70-%130 of the original (orig 1000 lines →
      output 700-1300)
    - NO TEXT outside the code block — no preamble, no summary, no
      "here are the changes:" explanation
    - Markdown ``` optional but must be a single code block

    Output format:
    ```
    [file's FIRST line]
    [...original code with change applied...]
    [file's LAST line]
    ```

    PIPELINE SAFETY: If output is less than %50 of original size, push is
    automatically CANCELED. Producing abbreviated output makes the pipeline
    retry — wasting both time and money.
  agent: senior_developer

# ══════════════════════════════════════════════════════════════
# PHASE 3: Review — PR Validation
# ══════════════════════════════════════════════════════════════

review_pr_task:
  description: >
    TASK: Validate that PR #{pr_id} changes align with the work item and meet
    code quality bar.

    WORK ITEM: #{work_item_id}
    BUSINESS REQUIREMENTS:
    {requirements}

    PR: {pr_url}
    Repo: {target_repo}

    ⚠️ CRITICAL DECISION RULE:
    - If PR changes DO NOT match work item asks ONE-TO-ONE → VERDICT: CHANGES_REQUIRED
    - If plan changes 6 files but PR contains 1 file → CHANGES_REQUIRED
    - If PR code is superficial (one line, one field) while WI asks for deep
      change → CHANGES_REQUIRED
    - If acceptance criteria are not met → CHANGES_REQUIRED
    - If there are syntax errors / obvious bugs → CHANGES_REQUIRED

    DO NOT give fake APPROVE — if PR is incomplete, say so explicitly. The
    pipeline halts on your verdict.

    YOUR STEPS:
    ⚡ COST/SPEED: If context has a "PR DEĞİŞİKLİKLERİ" heading, the changed files
    and their feature-branch contents are ALREADY provided there. In that case DO
    NOT call get_pr_changes or browse_repo — review directly from context. Only use
    tools for a file you genuinely need that is NOT already in context.
    1. Determine changed files: use the "PR DEĞİŞİKLİKLERİ" block if present;
       otherwise use "get_pr_changes".
    2. Read each changed file: from the "PR DEĞİŞİKLİKLERİ" block if present;
       otherwise read it (branch: {target_branch}).
    3. Apply the checklists below:

    ACCEPTANCE CRITERIA CHECK (FIRST):
    If context has an "Acceptance Criteria" heading, check each one:
    - [ ] Is each acceptance criterion satisfied in the PR's code?
    - [ ] Any unmet criterion → VERDICT: CHANGES_REQUIRED
    These criteria are binding (set during BA and technical design).

    BUSINESS ALIGNMENT CHECK:
    - [ ] Does PR change only the files asked by the WI?
    - [ ] Any unrelated file changes?
    - [ ] Are ALL WI requirements met?
    - [ ] Is the example pattern applied correctly?

    MINIMALITY CHECK (scope creep):
    - [ ] Are the changes minimal — ONLY what the task requires?
    - [ ] Any line touched beyond the plan (refactor, rename, reformat,
          reordered imports, style churn on unrelated lines)? → flag it.
    - [ ] Any task-tied comments added (e.g. "// added for WI")? → flag it.
    - [ ] Unrelated "improvements" the WI did not ask for → CHANGES_REQUIRED.

    REGRESSION CHECK (deleted/altered existing logic) — CRITICAL:
    For EVERY removed (-) line in the diff, ask: was this an EXISTING
    validation, guard, condition, branch, or error message?
    - [ ] Did the PR rewrite an existing `if`/guard into a different
          condition (widen/narrow/repurpose)? e.g. `if (X && noFilter)`
          became `if (noFilter)` — that DELETES business rule X.
    - [ ] Did it remove or change an existing error message / return / log
          the WI did not ask to change?
    - [ ] Did it drop a branch, early-return, null-check, or permission check?
    If a removed (-) line carried logic the WI did NOT explicitly ask to
    remove → VERDICT: CHANGES_REQUIRED. Adding a new check must NOT come at
    the cost of silently deleting an existing one.

    CODE QUALITY CHECK (SOLID & CLEAN CODE):
    - [ ] Single Responsibility: each class/method has one responsibility?
    - [ ] Open/Closed: change extends without breaking existing code?
    - [ ] Liskov Substitution: subclasses substitute superclasses correctly?
    - [ ] Interface Segregation: no unnecessary dependencies?
    - [ ] Dependency Inversion: depends on abstractions, not concretes?
    - [ ] Naming conventions consistent with project's existing style?
    - [ ] Error handling (try-catch, null check, validation) sufficient?
    - [ ] Edge cases handled?
    - [ ] No over-engineering / unnecessary complexity?
    - [ ] No performance issues (N+1, unnecessary loops, big memory)?
    - [ ] No syntax errors / missing imports?

    4. Use "add_pr_comment" to comment the result on the PR
    5. Also comment on the work item ({work_item_id})

    {scrum_master_feedback}

    PREVIOUS STEP OUTPUTS:
    {previous_context}
  expected_output: >
    ## PR Review Result

    **Verdict:** (choose exactly ONE word) APPROVE  —or—  CHANGES_REQUIRED

    **Acceptance Criteria Check:**
    - [Criterion 1]: MET / UNMET - [explanation]
    - [Criterion 2]: MET / UNMET - [explanation]

    **Business Alignment:**
    - Met requirements: [list]
    - Missing requirements: [list or "None"]

    **Code Quality (SOLID & Clean Code):**
    - SOLID compliance: [assessment]
    - Clean code: [assessment]
    - Issues: [list or "None"]

    **Unrelated Changes:**
    - [list or "None"]

    The VERY LAST line of your answer MUST be a machine-readable decision token,
    exactly one of these two, with nothing else on the line:
    REVIEW_DECISION: APPROVE
    REVIEW_DECISION: CHANGES_REQUIRED
  agent: code_reviewer

# ══════════════════════════════════════════════════════════════
# PHASE 4: Testing and Quality Assurance
# ══════════════════════════════════════════════════════════════

test_planning_task:
  description: >
    TASK: Produce a test plan for the changes made for work item {work_item_id}.
    Inspect the PR changes, read the {target_branch} branch in {target_repo}.

    IMPORTANT: If previous context contains a "Kickoff Meeting Summary", take
    the QA perspective into account. The QA engineer already evaluated test
    scenarios and regression risk in kickoff. Use those as starting point,
    expand and extend.

    The test plan must include:
    - Happy path scenarios
    - Error scenarios
    - Edge cases (boundary values)
    - Integration test scenarios
    - Unit test code where possible

    {scrum_master_feedback}

    PREVIOUS STEP OUTPUTS:
    {previous_context}
  expected_output: >
    Test plan: list of test scenarios, edge cases, suggested unit test code.
  agent: qa_engineer

uat_task:
  description: >
    TASK: Perform user acceptance test for work item {work_item_id}.

    STEP 0 — PREPARE ACCEPTANCE CRITERIA:
    If context has an "Acceptance Criteria (Binding Throughout Pipeline)"
    heading, USE IT — do not call get_work_item, criteria are already set.
    These criteria were set by BA before technical design and are binding
    across the pipeline.

    If context has no acceptance criteria, use "get_work_item" to fetch WI
    and extract them.

    If "Kickoff Meeting Summary" exists, take the UAT perspective into account.

    STEP 1 — REVIEW PR CHANGES:
    Use "get_pr_changes" to inspect PR changes.
    Determine which acceptance criterion each change addresses.

    STEP 2 — EVALUATION:
    For each acceptance criterion give PASS or FAIL.
    For FAIL, explain what's missing.

    {scrum_master_feedback}

    PREVIOUS STEP OUTPUTS:
    {previous_context}
  expected_output: >
    ## UAT Report

    **Acceptance Criteria:**
    1. [Criterion] - PASS/FAIL - [Explanation]
    2. [Criterion] - PASS/FAIL - [Explanation]
    ...

    **Overall Evaluation:** ACCEPTED / REJECTED
    **Gaps:** [list or "None"]
  agent: uat_specialist

# ══════════════════════════════════════════════════════════════
# PHASE 5: Completion Report
# ══════════════════════════════════════════════════════════════

completion_report_task:
  description: >
    TASK: Produce a completion report for work item {work_item_id}.
    Summarize the whole process: requirements, changes made, test results,
    UAT results and PR info.
    Add the summary as a comment to the work item.

    PREVIOUS STEP OUTPUTS:
    {previous_context}
  expected_output: >
    Completion report: work summary, change list, test results, UAT results,
    PR link. Comment must be added to the work item.
  agent: scrum_master

# ══════════════════════════════════════════════════════════════
# Scrum Master Review (quality gate after each step)
# ══════════════════════════════════════════════════════════════

scrum_review_task:
  description: >
    TASK: Review the output of the step below and run a quality gate.

    STEP: {step_name}
    WORK ITEM: #{work_item_id}

    STEP OUTPUT:
    {step_output}

    EVALUATION CRITERIA:
    - Is the output aligned with the work item?
    - Is the output complete and clear?
    - Are there any errors or inconsistencies?
    - Is the output sufficient for the next step?

    Declare your decision as APPROVE or IMPROVE.
    If IMPROVE, list deficiencies and concrete improvement suggestions.
  expected_output: >
    **Decision:** APPROVE or IMPROVE

    **Evaluation:** [brief explanation]

    **Improvement Suggestions (if IMPROVE):**
    - [concrete suggestion 1]
    - [concrete suggestion 2]
  agent: scrum_master
