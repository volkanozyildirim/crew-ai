# Yükseltmede taban imaj şablonu ve yama sürümü (spec: language-upgrade-design.md, "Ek 2026-11-18").
repo: base-images
project: FLODevOps
branch: staging
# Taşıma sırası: ilk dal `branch` olmalı. Düzeltme ilk dalda hazırsa Tempo bir sonraki dala taslak taşıma PR'ı açar.
flow: [staging, preprod, production]
regions: {anatolia: mainLocation, global: globalLocation, russia: yandexLocation}
patch: {}            # elle sabitleme, ör. {php: {"8.5": "8.5.12"}}
fixes:
  php:
    "8.5":
      # `drop`: satırın komut kısmının (baştaki boşluk ve sondaki `&& \\` / `; \\` hariç) TAMAMEN eşleşmesi gereken regex
      - drop: 'docker-php-ext-(install|enable) opcache'
        note: "Opcache 8.5'te çekirdeğe gömülü; kurulum adımı hata verir."
