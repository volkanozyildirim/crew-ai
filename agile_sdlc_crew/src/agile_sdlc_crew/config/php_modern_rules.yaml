# PHP modernleştirme kataloğu — Teknik borç aşama 2a.
# Kural metni kullanıcıya (sekme) ve Task açıklamasına aynen gider; Türkçe.
# since: özelliğin geldiği PHP sürümü; yalnız since ≤ hedef sürüm olan kurallar önerilir.
# kind: deprecation (hedefte uyarı/hata) | mechanical (davranış aynı, otonom) | structural (tasarım kararı, needs-human) | report (iş açılmaz)
# breaks: yükseltmeyi etkileyen kural — error (hedef sürümde çalışmaz) | behavior (sessizce başka davranır, otomatik düzeltilmez, insan bakar) | deprecation (uyarı verir; otomatik düzeltilebiliyorsa yükseltmeyi bekletir). Boş = yükseltme kuralı değil.
# fix_min: kuralın düzeltmesinin çalıştığı en düşük PHP sürümü (varsayılan 7.0); örn. "8.4"
# unit: file (dosya başına birim, paketlenir) | module (kaynak kökünden 2 dizin, paketlenmez)
# upgrade_catalog: true → sürüm yükseltme dalının eklediği kural; modernleştirme taramasında yalnız
#   CREW_TECHDEBT_UPGRADE açıkken görünür (yükseltme hattı her zaman görür).
version: 4
rules:
  # ── deprecation: hedef sürümde uyarı / hata üretir ──
  - key: implicit_nullable
    since: "8.4"
    kind: deprecation
    breaks: deprecation
    unit: file
    auto: true
    sp_unit: 1
    title: "Örtük nullable parametre (Type $x = null)"
    summary: "Tipli bir parametreye varsayılan null verilmiş ama tip ?Type yazılmamış. PHP 8.4 bunu deprecation olarak loglar, PHP 9'da hata olur."
    advantages:
      - "Üretim logundaki deprecation gürültüsü kesilir; New Relic'te gerçek hatalar görünür kalır."
      - "PHP 9 geçişinin en yaygın kırılma noktası şimdiden kapanır."
      - "İmza niyeti açık: parametre gerçekten null olabilir."
    risks:
      - "Yok — davranış birebir aynı; yalnız imza değişir."
    before: "function find(string $sku = null, array $opts = null)"
    after: "function find(?string $sku = null, ?array $opts = null)"
    ref: "https://wiki.php.net/rfc/deprecate-implicitly-nullable-types"
    rector: "Rector\\Php84\\Rector\\Param\\ExplicitNullableParamTypeRector"
  - key: utf8_encode
    requires: [mbstring]   # mb_convert_encoding; repoda kanıt yoksa DevOps'a gider
    since: "8.2"
    kind: deprecation
    breaks: deprecation
    unit: file
    auto: true
    sp_unit: 1
    title: "utf8_encode / utf8_decode"
    summary: "Yalnız ISO-8859-1 ↔ UTF-8 çeviren ve adı yanıltıcı olan bu fonksiyonlar 8.2'de deprecated; 9'da kaldırılacak."
    advantages:
      - "Deprecation logu kesilir."
      - "mb_convert_encoding ile kaynak kodlama açıkça yazılır; Türkçe karakter bozulmalarının bir sınıfı ortadan kalkar."
    risks:
      - "Kaynak kodlama gerçekten ISO-8859-1 değilse eski kod zaten yanlış çeviriyordu; değişiklik bunu görünür kılabilir."
    before: "$s = utf8_encode($raw);"
    after: "$s = mb_convert_encoding($raw, 'UTF-8', 'ISO-8859-1');"
    ref: "https://wiki.php.net/rfc/remove_utf8_decode_and_utf8_encode"
    rector: "Rector\\Php82\\Rector\\FuncCall\\Utf8DecodeEncodeToMbConvertEncodingRector"
  - key: string_interp_brace
    since: "8.2"
    kind: deprecation
    breaks: deprecation
    unit: file
    auto: true
    sp_unit: 1
    title: "\"${var}\" string içi değişken"
    summary: "Çift tırnak içinde ${var} ve ${expr} biçimi 8.2'de deprecated."
    advantages:
      - "Deprecation logu kesilir."
      - "{$var} biçimi tek ve okunur standart olur."
    risks:
      - "Yok — çıktı aynı."
    before: "\"Sipariş ${orderNo} hazır\""
    after: "\"Sipariş {$orderNo} hazır\""
    ref: "https://wiki.php.net/rfc/deprecate_dollar_brace_string_interpolation"
    rector: "Rector\\Php82\\Rector\\Encapsed\\VariableInStringInterpolationFixerRector"
  - key: filter_sanitize_string
    since: "8.1"
    kind: deprecation
    breaks: deprecation
    unit: file
    auto: true
    sp_unit: 1
    title: "FILTER_SANITIZE_STRING"
    summary: "Etiket soyup tırnakları HTML entity yapan bu filtre 8.1'de deprecated; ne yaptığı belirsiz olduğu için kaldırılıyor."
    advantages:
      - "Deprecation logu kesilir."
      - "Niyet açık hale gelir: htmlspecialchars (çıktıda kaçış) ya da strip_tags (girdiyi temizleme)."
    risks:
      - "İki fonksiyon aynı şeyi yapmaz; çağrı yerine göre doğru olan seçilmeli (yapısal karar olan yerler insana bırakılır)."
    before: "filter_var($q, FILTER_SANITIZE_STRING)"
    after: "htmlspecialchars($q, ENT_QUOTES)"
    ref: "https://wiki.php.net/rfc/deprecations_php_8_1#filter_sanitize_string"
  - key: removed_functions
    requires_if: {money_format: [intl]}   # NumberFormatter
    since: "8.0"
    kind: deprecation
    breaks: error
    unit: file
    auto: true
    sp_unit: 1
    title: "8.0'da kaldırılan fonksiyonlar (each, create_function, money_format, get_magic_quotes_gpc, fgetss…)"
    summary: "Bu çağrılar (each, create_function, money_format, get_magic_quotes_gpc/runtime, ezmlm_hash, restore_include_path, hebrevc, convert_cyr_string, fgetss, gzgetss, image2wbmp, png2wbmp, jpeg2wbmp, ldap_sort, read_exif_data) 8.0'dan beri yok: ulaşıldığında Fatal error üretir. Üretimde kalmışsa o yol ya hiç çalışmıyor ya da ölü kod."
    advantages:
      - "Gizli bir Fatal error kaynağı kapanır ya da ölü kod silinir."
    risks:
      - "Yol gerçekten kullanılıyorsa bugüne kadar patlıyordu; düzeltme davranışı görünür kılar."
    before: "while (list($k, $v) = each($arr)) { … }"
    after: "foreach ($arr as $k => $v) { … }"
    ref: "https://www.php.net/manual/en/migration80.incompatible.php"

  - key: dynamic_properties
    since: "8.2"
    kind: deprecation
    breaks: deprecation
    unit: file
    auto: true
    line_local: false  # blok/sınıf düzeyinde — araç kaçırdıysa LLM penceresiyle düzeltilmez
    sp_unit: 1
    title: "Bildirilmemiş property'ye atama (dinamik property)"
    summary: "Sınıfta tanımlı olmayan bir property'ye `$this->x = …` ile atama PHP 8.2'de deprecation, PHP 9'da hata. Yalnız kalıtım, trait ve __set olmayan sınıflarda raporlanır."
    advantages:
      - "PHP 9 geçişinin en yaygın kırılma noktası şimdiden kapanır."
      - "Sınıfın tuttuğu veri tanımdan okunur; yazım hatasıyla yeni property oluşturma yakalanır."
    risks:
      - "Yok — property sınıfa bildirilir (tipli ya da tipsiz); değer ve davranış aynı."
    before: "class Cart {\n    public function load() { $this->items = []; }\n}"
    after: "class Cart {\n    private array $items = [];\n    public function load() { $this->items = []; }\n}"
    ref: "https://wiki.php.net/rfc/deprecate_dynamic_properties"
  - key: partial_callable
    since: "8.2"
    kind: deprecation
    breaks: deprecation
    unit: file
    auto: true
    sp_unit: 1
    title: "\"self::m\" / \"parent::m\" string callable'ları"
    summary: "Yalnız call_user_func ile çalışan, is_callable'ın tutarsız davrandığı bu string callable'lar 8.2'de deprecated, 9'da kaldırılacak."
    advantages:
      - "Statik analiz ve IDE callable'ı takip edebilir; yeniden adlandırmada kırılmaz."
    risks:
      - "Yok — aynı metot çağrılır."
    before: "usort($list, 'self::compare');"
    after: "usort($list, self::compare(...));"
    ref: "https://wiki.php.net/rfc/deprecate_partially_supported_callables"
  - key: mb_legacy_encoding
    since: "8.2"
    kind: deprecation
    breaks: deprecation
    unit: file
    auto: true
    sp_unit: 1
    title: "mb_* ile HTML-ENTITIES / BASE64 / UUENCODE / QPRINT kodlaması"
    summary: "Bu sözde kodlamalar 8.2'de mbstring'den kullanımdan kalktı; karşılıkları ayrı fonksiyonlardır."
    advantages:
      - "Doğru fonksiyon niyeti açık eder (ör. htmlspecialchars / base64_encode)."
    risks:
      - "HTML-ENTITIES karşılığı tek fonksiyon değil: mb_encode_numericentity / htmlspecialchars / html_entity_decode — çağrı yerine göre doğru olan seçilmeli."
    before: "$html = mb_convert_encoding($s, 'HTML-ENTITIES', 'UTF-8');"
    after: "$html = mb_encode_numericentity($s, [0x80, 0x10FFFF, 0, 0x1FFFFF], 'UTF-8');"
    ref: "https://www.php.net/manual/en/migration82.deprecated.php"
  - key: get_class_noarg
    since: "8.3"
    kind: deprecation
    breaks: deprecation
    unit: file
    auto: true
    sp_unit: 1
    title: "Argümansız get_class() / get_parent_class() → self::class / parent::class"
    summary: "Argümansız çağrı 8.3'te deprecated."
    advantages:
      - "Derleme zamanında çözülür; okunur."
    risks:
      - "Yok — aynı sınıf adı döner."
    before: "$name = get_class();"
    after: "$name = self::class;"
    ref: "https://wiki.php.net/rfc/deprecations_php_8_3"
  - key: deprecated_83
    since: "8.3"
    kind: deprecation
    breaks: deprecation
    unit: file
    auto: true
    sp_unit: 1
    title: "8.3'te kullanımdan kalkanlar (assert_options, MT_RAND_PHP)"
    summary: "assert_options() ini ayarlarıyla, MT_RAND_PHP ise varsayılan Mt19937 ile değiştirilmeli."
    advantages:
      - "Üretim logundaki deprecation gürültüsü kesilir; 9'a hazırlık."
    risks:
      - "MT_RAND_PHP kaldırılınca aynı seed farklı sayı dizisi üretir — seed'e bağlı tekrarlanabilir çıktı varsa kontrol edilmeli."
    before: "mt_srand($seed, MT_RAND_PHP);"
    after: "mt_srand($seed);"
    ref: "https://wiki.php.net/rfc/deprecations_php_8_3"
  - key: deprecated_84
    since: "8.4"
    kind: deprecation
    breaks: deprecation
    unit: file
    auto: true
    sp_unit: 1
    title: "8.4'te kullanımdan kalkanlar (lcg_value, mysqli_ping/kill/refresh, E_STRICT, E_USER_ERROR…)"
    summary: "Bu fonksiyon ve sabitler 8.4'te deprecated; E_STRICT artık hiçbir hata üretmiyor, trigger_error(E_USER_ERROR) yerine exception beklenir."
    advantages:
      - "Deprecation gürültüsü kesilir; PHP 9'da kırılacak yerler şimdiden temizlenir."
    risks:
      - "trigger_error(…, E_USER_ERROR) yerine exception fırlatmak akışı değiştirir: yakalayan katman olup olmadığı her yerde kontrol edilmeli."
    before: "error_reporting(E_ALL & ~E_STRICT);\n$r = lcg_value();"
    after: "error_reporting(E_ALL);\n$r = mt_rand() / mt_getrandmax();"
    ref: "https://wiki.php.net/rfc/deprecations_php_8_4"

  # ── yükseltme kırılma kuralları (7.4 → 8.5): hedef sürümde çalışmayan / sessizce başka davranan kod ──
  - key: curly_offset
    upgrade_catalog: true
    since: "8.0"
    kind: deprecation
    breaks: error
    unit: file
    auto: true
    sp_unit: 1
    title: "Süslü parantezle ofset erişimi ($s{0})"
    summary: "Dizi / string elemanına `$s{0}` biçiminde erişim PHP 8.0'da kaldırıldı: derleme sırasında Parse error verir, dosya hiç yüklenmez."
    advantages:
      - "Dosya PHP 8'de yüklenebilir hale gelir; Parse error riski kapanır."
      - "Köşeli parantez biçimi 7.x'te de aynı çalışır — yükseltmeyi beklemeden uygulanabilir."
    risks:
      - "Yok — `$s{0}` ile `$s[0]` aynı elemanı verir."
    before: "$ilk = $isim{0};"
    after: "$ilk = $isim[0];"
    ref: "https://www.php.net/manual/en/migration80.incompatible.php"
  - key: removed_casts
    upgrade_catalog: true
    since: "8.0"
    kind: deprecation
    breaks: error
    unit: file
    auto: true
    sp_unit: 1
    title: "Kaldırılan cast'ler ((real), (unset))"
    summary: "`(real)` ve `(unset)` cast'leri 8.0'da kaldırıldı: derleme sırasında hata verir."
    advantages:
      - "Dosya PHP 8'de yüklenebilir hale gelir."
      - "Karşılıkları (`(float)`, `null`) 7.x'te de aynı çalışır."
    risks:
      - "`(unset) $x` her zaman null veriyordu; yerine düz `null` yazılır — `$x` yan etkisi (örn. fonksiyon çağrısı) varsa ayrıca korunmalı."
    before: "$f = (real) $deger;\n$n = (unset) $x;"
    after: "$f = (float) $deger;\n$n = null;"
    ref: "https://www.php.net/manual/en/migration80.incompatible.php"
  - key: required_after_optional
    upgrade_catalog: true
    since: "8.0"
    kind: deprecation
    breaks: deprecation
    unit: file
    auto: true
    sp_unit: 1
    title: "Varsayılanlı parametreden sonra varsayılansız parametre"
    summary: "`function f($a = 1, $b)` biçimindeki imza 8.0'da deprecation üretir (`?Tip $a = null, $b` istisnadır). Varsayılan değer fiilen hiçbir zaman kullanılamıyordu."
    advantages:
      - "Deprecation gürültüsü kesilir; imza gerçek davranışı yansıtır."
    risks:
      - "Varsayılanı kaldırmak çağıranları etkilemez (zaten vermek zorundaydılar); parametre sırasını değiştirmek ise tüm çağrı yerlerini etkiler — sırayı değiştirme, varsayılanı kaldır."
    before: "function listele($sayfa = 1, $filtre) { … }"
    after: "function listele($sayfa, $filtre) { … }"
    ref: "https://www.php.net/manual/en/migration80.deprecated.php"
  - key: legacy_autoload
    upgrade_catalog: true
    since: "8.0"
    kind: structural
    breaks: error
    unit: file
    auto: false
    line_local: false  # yükleme düzeni değişir — pencere düzeltmesi güvenli değil
    sp_unit: 2
    title: "__autoload() fonksiyonu"
    summary: "`function __autoload($class)` 8.0'da kaldırıldı; tanımlanması Fatal error verir. Sınıf yükleme `spl_autoload_register()` ile yapılmalı."
    advantages:
      - "Sınıf yüklemesi PHP 8'de çalışmaya devam eder; birden çok yükleyici (composer dahil) birlikte yaşayabilir."
    risks:
      - "Yükleme sırası ve hata davranışı değişebilir; composer autoload ile çakışma olup olmadığı elle doğrulanmalı."
    before: "function __autoload($class) { require \"lib/$class.php\"; }"
    after: "spl_autoload_register(function ($class) { require \"lib/$class.php\"; });"
    ref: "https://www.php.net/manual/en/migration80.incompatible.php"
  - key: php4_constructor
    upgrade_catalog: true
    since: "8.0"
    kind: structural
    breaks: behavior
    unit: file
    auto: false
    line_local: false
    sp_unit: 2
    title: "PHP 4 tarzı yapıcı (sınıf adıyla aynı adlı metot)"
    summary: "Sınıfla aynı adı taşıyan metot 8.0'da yapıcı sayılmaz; sıradan bir metot olur ve nesne oluşturulurken çağrılmaz. Sınıfta `__construct` yoksa ilklendirme sessizce atlanır."
    advantages:
      - "Yapıcı mantığı PHP 8'de de çalışır; ilklendirilmeyen nesne hataları önlenir."
    risks:
      - "Metot şimdiye kadar yapıcı olarak çalıştıysa yeniden adlandırma çağıranları ve alt sınıfların `parent::Ad()` çağrılarını etkiler — insan bakmalı."
    before: "class Sepet {\n    function Sepet() { $this->urunler = []; }\n}"
    after: "class Sepet {\n    function __construct() { $this->urunler = []; }\n}"
    ref: "https://www.php.net/manual/en/migration80.deprecated.php"
  - key: loose_compare_numeric
    upgrade_catalog: true
    since: "8.0"
    kind: structural
    breaks: behavior
    unit: file
    auto: false
    line_local: false
    sp_unit: 1
    title: "Sayı ile sayısal olmayan string'in gevşek karşılaştırması"
    summary: "PHP 8.0'da `0 == \"abc\"` artık false: sayı ile sayısal olmayan string, string olarak karşılaştırılır. 7.x'te true idi. Aynı satırdaki mantık sessizce ters döner."
    advantages:
      - "Karşılaştırma niyeti açık ve sürümden bağımsız olur."
    risks:
      - "Eski davranışa güvenen akış (ör. `0 == $durum` ile boş string yakalama) farklı çalışır — hangi davranışın istendiğine insan karar vermeli."
    before: "if (0 == 'abc') { … }   // 7.x: true, 8.x: false"
    after: "if ((string) 0 === 'abc') { … }   // niyeti açıkça yaz"
    ref: "https://www.php.net/manual/en/migration80.incompatible.php"
  - key: null_to_internal
    upgrade_catalog: true
    since: "8.1"
    kind: structural
    breaks: behavior
    unit: file
    auto: false
    line_local: false
    sp_unit: 1
    title: "İç fonksiyona literal null argüman (strlen(null) vb.)"
    summary: "`strlen`, `strpos`, `str_replace`, `trim`, `explode`, `htmlspecialchars`, `strtolower`, `strtoupper`, `substr` çağrısında string parametreye null vermek 8.1'de deprecation; 9.0'da TypeError olacak."
    advantages:
      - "Deprecation gürültüsü kesilir; PHP 9'da TypeError'a dönecek yerler şimdiden temizlenir."
    risks:
      - "null'ı '' ile değiştirmek davranışı korur, ama null'ın gelmesi çoğu zaman bir veri hatasının belirtisidir — nedenine insan bakmalı."
    before: "$uzunluk = strlen(null);"
    after: "$uzunluk = strlen('');"
    ref: "https://wiki.php.net/rfc/deprecate_null_to_scalar_internal_arg"
  - key: removed_81
    upgrade_catalog: true
    since: "8.1"
    kind: deprecation
    breaks: deprecation
    unit: file
    auto: true
    sp_unit: 1
    title: "8.1'de kullanımdan kalkan fonksiyonlar (strftime, date_sunrise, mhash…)"
    summary: "`strftime`, `gmstrftime`, `date_sunrise`, `date_sunset`, `mhash*`, `odbc_result_all` 8.1'de deprecated, 9.0'da kaldırılacak."
    advantages:
      - "Deprecation gürültüsü kesilir; PHP 9'da kırılacak çağrılar şimdiden temizlenir."
    risks:
      - "`strftime` biçimleri `date()` / `IntlDateFormatter` ile birebir değildir; yerel ayara bağlı çıktılar (ay/gün adları) farklılaşabilir — çıktı karşılaştırılmalı."
    before: "echo strftime('%d.%m.%Y', $ts);"
    after: "echo date('d.m.Y', $ts);"
    ref: "https://www.php.net/manual/en/migration81.deprecated.php"
  - key: serializable_only
    upgrade_catalog: true
    since: "8.1"
    kind: structural
    breaks: deprecation
    unit: file
    auto: false
    line_local: false  # sınıf düzeyinde: serileştirme biçimi tasarım kararı
    sp_unit: 2
    title: "Serializable arayüzü, __serialize/__unserialize olmadan"
    summary: "`implements Serializable` yapıp `__serialize()` / `__unserialize()` yazmamak 8.1'de deprecation üretir."
    advantages:
      - "Deprecation gürültüsü kesilir; serileştirme davranışı açık ve test edilebilir olur."
    risks:
      - "Daha önce serileştirilip saklanmış (cache, session, kuyruk) veriler yeni biçimle okunabilmeli — iki metot birlikte yazılırsa eski veri okunmaya devam eder."
    before: "class Sepet implements Serializable {\n    public function serialize() { … }\n    public function unserialize($d) { … }\n}"
    after: "class Sepet implements Serializable {\n    public function __serialize(): array { … }\n    public function __unserialize(array $d): void { … }\n    // serialize()/unserialize() 7.x uyumu için kalır\n}"
    ref: "https://wiki.php.net/rfc/phase_out_serializable"
  - key: moved_to_pecl_84
    upgrade_catalog: true
    requires_if: {imap_: [imap], pspell_: [pspell], oci_: [oci8]}
    since: "8.4"
    kind: structural
    breaks: error
    unit: file
    auto: false
    sp_unit: 2
    title: "PECL'e taşınan eklentiler (imap, pspell, oci8)"
    summary: "`imap_*`, `pspell_*` ve `oci_*` fonksiyonları 8.4 ile PHP çekirdeğinden çıktı; imajda PECL ile kurulmadıkça çağrı Fatal error verir."
    advantages:
      - "Yükseltme sonrası bu fonksiyonların kaybolması önceden bilinir ve altyapı hazırlanır."
    risks:
      - "Kod değişikliği değil imaj / eklenti işi: eklenti PECL ile kurulmalı (DevOps) ya da kullanım başka bir kütüphaneye taşınmalı."
    before: "$kutu = imap_open($host, $kullanici, $parola);"
    after: "# php-8-4 imajına imap eklentisi PECL ile eklenir ya da çağrı ayrı bir kütüphaneye taşınır"
    ref: "https://www.php.net/manual/en/migration84.incompatible.php"
  - key: noncanonical_casts_85
    upgrade_catalog: true
    since: "8.5"
    kind: deprecation
    breaks: deprecation
    unit: file
    auto: true
    sp_unit: 1
    title: "Kanonik olmayan cast adları ((boolean), (integer), (double), (binary))"
    summary: "`(boolean)`, `(integer)`, `(double)`, `(binary)` PHP 8.5'te deprecated; kanonik adlar `(bool)`, `(int)`, `(float)`, `(string)`."
    advantages:
      - "Deprecation gürültüsü kesilir; kanonik adlar 7.x'te de aynı çalışır."
    risks:
      - "Yok — davranış birebir aynı."
    before: "$a = (integer) $x;\n$b = (double) $y;"
    after: "$a = (int) $x;\n$b = (float) $y;"
    ref: "https://www.php.net/manual/en/migration85.deprecated.php"
  - key: backtick_exec_85
    upgrade_catalog: true
    since: "8.5"
    kind: deprecation
    breaks: deprecation
    unit: file
    auto: true
    sp_unit: 1
    title: "Backtick operatörü (`komut`)"
    summary: "Backtick ile kabuk komutu çalıştırma 8.5'te deprecated; `shell_exec()` ile birebir aynı."
    advantages:
      - "Deprecation gürültüsü kesilir; komut çalıştırma niyeti okunur ve aranabilir olur."
    risks:
      - "Yok — `shell_exec()` aynı değeri döndürür. Komut metni kullanıcı girdisi içeriyorsa ayrı bir güvenlik incelemesi gerekir."
    before: "$cikti = `ls -l $dizin`;"
    after: "$cikti = shell_exec(\"ls -l $dizin\");"
    ref: "https://www.php.net/manual/en/migration85.deprecated.php"
  - key: deprecated_85
    upgrade_catalog: true
    since: "8.5"
    kind: structural
    breaks: deprecation
    unit: file
    auto: false
    sp_unit: 1
    title: "8.5'te kullanımdan kalkanlar (curl_close, imagedestroy, finfo_close, case ; …)"
    summary: "PHP 8.5'te deprecated: `curl_close`, `curl_share_close`, `finfo_close`, `imagedestroy`, `mysqli_execute`, `socket_set_timeout`, `xml_parser_free`, `ldap_connect_wallet`, `MHASH_*` sabitleri ve `case 1;` (iki nokta yerine noktalı virgül). Nesneler zaten otomatik serbest kalıyor; bu çağrıların etkisi yok."
    advantages:
      - "Deprecation gürültüsü kesilir; PHP 9'da kırılacak yerler şimdiden temizlenir."
    risks:
      - "Çağrıyı silmek güvenlidir (8.0'dan beri nesne tutamaçları otomatik serbest kalır) ama `mysqli_execute` → `mysqli_stmt_execute`, `socket_set_timeout` → `stream_set_timeout` gibi yer değiştirenler elle eşlenmeli."
    before: "curl_close($ch);\nswitch ($x) {\n    case 1;\n        break;\n}"
    after: "// curl_close çağrısı silinir\nswitch ($x) {\n    case 1:\n        break;\n}"
    ref: "https://www.php.net/manual/en/migration85.deprecated.php"
  # ── mechanical: davranış aynı, dönüşüm yerel ──
  - key: str_contains
    since: "8.0"
    kind: mechanical
    unit: file
    auto: true
    sp_unit: 1
    title: "strpos(...) !== false → str_contains()"
    summary: "Alt dize var mı kontrolü strpos'un dönüşünü false ile karşılaştırarak yapılıyor."
    advantages:
      - "Niyet okunur: 'içeriyor mu' sorusu tek fonksiyon."
      - "Klasik 0 / false tuzağı (== false, !strpos) biter — bu tuzak gerçek bug üretir."
      - "Aynı aile: str_starts_with / str_ends_with."
    risks:
      - "Yok — tarayıcı yalnız iki argümanlı, sıkı (=== / !==) karşılaştırmalı strpos/mb_strpos çağrılarını önerir; stripos (harf duyarsız), offset'li çağrılar ve gevşek (== false) karşılaştırmalar eşdeğer olmadığı için önerilmez."
    before: "if (strpos($uri, '/api/') !== false)"
    after: "if (str_contains($uri, '/api/'))"
    ref: "https://wiki.php.net/rfc/str_contains"
    rector: "Rector\\Php80\\Rector\\NotIdentical\\StrContainsRector"
  - key: str_starts_with
    since: "8.0"
    kind: mechanical
    unit: file
    auto: true
    sp_unit: 1
    title: "substr($s, 0, n) === … / strpos() === 0 → str_starts_with()"
    summary: "Önek kontrolü substr uzunluğu elle sayılarak ya da strpos === 0 ile yapılıyor."
    advantages:
      - "Elle sayılan uzunluk (yaygın off-by-one kaynağı) kalkar."
      - "Okunabilirlik: str_starts_with($sku, 'FLO-')."
    risks:
      - "Yok — tarayıcı yalnız uzunluğu literal'in uzunluğuna eşit olan substr($s, 0, N) === 'literal' biçimini önerir."
    before: "if (substr($sku, 0, 4) === 'FLO-')"
    after: "if (str_starts_with($sku, 'FLO-'))"
    ref: "https://wiki.php.net/rfc/add_str_starts_with_and_ends_with_functions"
    rector: "Rector\\Php80\\Rector\\Identical\\StrStartsWithRector"
  - key: null_coalesce
    since: "7.0"
    kind: mechanical
    unit: file
    auto: true
    sp_unit: 1
    title: "isset($a) ? $a : $b → $a ?? $b"
    summary: "Null birleştirme operatörü varken isset'li üçlü operatör kullanılıyor."
    advantages:
      - "İfade bir kez yazılır; kopyala-yapıştır farkı (isset($a['x']) ? $a['y'] : …) biter."
      - "Undefined array key uyarısı üretmeden güvenli okuma — New Relic'teki 'Undefined array key' hatalarının önleyici biçimi."
    risks:
      - "Yok — ?? tam olarak isset semantiğidir."
    before: "$city = isset($addr['city']) ? $addr['city'] : null;"
    after: "$city = $addr['city'] ?? null;"
    ref: "https://wiki.php.net/rfc/isset_ternary"
    rector: "Rector\\Php70\\Rector\\Ternary\\TernaryToNullCoalescingRector"
  - key: nullsafe
    since: "8.0"
    kind: mechanical
    unit: file
    auto: true
    sp_unit: 1
    title: "$a ? $a->b() : null → $a?->b()"
    summary: "Nesne null olabildiğinde üye erişimi üçlü operatörle korunuyor."
    advantages:
      - "Zincir kısalır, koşul ve erişim tek yerde; 'null üzerinde metot çağrısı' hatasının önleyici biçimi."
    risks:
      - "$a falsy ama null değilse (0, '', false) eski kod null dönerdi, ?-> Error fırlatır — bu yüzden tarayıcı truthiness biçimini ($a ? $a->b : null) ÖNERMEZ; yalnız `$a !== null ? $a->b : null` ve `!is_null($a) ? $a->b : null` biçimlerini, then dalı tam olarak tek üye erişimi/çağrısı olduğunda önerir."
    before: "$name = $order->getCustomer() ? $order->getCustomer()->getName() : null;"
    after: "$name = $order->getCustomer()?->getName();"
    ref: "https://wiki.php.net/rfc/nullsafe_operator"
  - key: array_destructuring
    since: "7.1"
    kind: mechanical
    unit: file
    auto: true
    sp_unit: 1
    title: "list($a, $b) = … → [$a, $b] = …"
    summary: "Eski list() sözdizimi."
    advantages:
      - "Kısa biçim; anahtarlı yıkım (['id' => $id] = $row) ve foreach içinde kullanım aynı sözdizimiyle."
    risks:
      - "Yok."
    before: "list($code, $message) = explode(':', $line, 2);"
    after: "[$code, $message] = explode(':', $line, 2);"
    ref: "https://wiki.php.net/rfc/short_list_syntax"
    rector: "Rector\\Php71\\Rector\\List_\\ListToArrayDestructRector"
  - key: match
    since: "8.0"
    kind: mechanical
    unit: file
    auto: true
    line_local: false  # blok/sınıf düzeyinde — araç kaçırdıysa LLM penceresiyle düzeltilmez
    sp_unit: 1
    title: "Her dalı tek değer döndüren switch → match"
    summary: "switch'in her case'i aynı değişkene atama ya da return yapıyor; break unutma riski taşıyor."
    advantages:
      - "Strict (===) karşılaştırma: '1' == 1 tuzağı biter."
      - "Eşleşmeyen değer sessizce geçmez, UnhandledMatchError fırlatır — eksik dal testte görünür."
      - "İfade olduğu için doğrudan return/atama; break yok, düşme (fall-through) hatası yok."
    risks:
      - "Eski switch'te eşleşmeyen değer sessizce geçer, match UnhandledMatchError fırlatır; switch gevşek (==), match sıkı (===) karşılaştırır. Tarayıcı bu yüzden yalnız default'u olan, etiketleri string literal olan ve düşme (fall-through) içermeyen switch'leri önerir."
    before: |
      switch ($status) {
          case 'paid': $label = 'Ödendi'; break;
          case 'refund': $label = 'İade'; break;
          default: $label = 'Bilinmiyor';
      }
    after: |
      $label = match ($status) {
          'paid' => 'Ödendi',
          'refund' => 'İade',
          default => 'Bilinmiyor',
      };
    ref: "https://wiki.php.net/rfc/match_expression_v2"
    rector: "Rector\\Php80\\Rector\\Switch_\\ChangeSwitchToMatchRector"
  - key: first_class_callable
    since: "8.1"
    kind: mechanical
    unit: file
    auto: true
    sp_unit: 1
    title: "[$this, 'metot'] / 'fonksiyon' → metot(...)"
    summary: "array_map, usort, array_filter gibi çağrılara callable dizi ya da string olarak veriliyor."
    advantages:
      - "Statik analiz ve IDE metodu görür; yeniden adlandırma kırmaz (string içindeki ad bulunamazdı)."
      - "Yanlış yazılmış metot adı çalışma zamanında değil, analizde yakalanır."
    risks:
      - "Yok."
    before: "array_map([$this, 'normalize'], $rows)"
    after: "array_map($this->normalize(...), $rows)"
    ref: "https://wiki.php.net/rfc/first_class_callable_syntax"
    rector: "Rector\\Php81\\Rector\\Array_\\ArrayToFirstClassCallableRector"  # yalnız [$obj, 'm'] biçimi
  - key: ctor_promotion
    since: "8.0"
    kind: mechanical
    unit: file
    auto: true
    line_local: false  # blok/sınıf düzeyinde — araç kaçırdıysa LLM penceresiyle düzeltilmez
    sp_unit: 1
    title: "Yalnız $this->x = $x yapan constructor → constructor promotion"
    summary: "Property tanımı, constructor parametresi ve atama üç ayrı yerde tekrar ediyor."
    advantages:
      - "Her bağımlılık tek satır; sınıf gövdesi kısalır, yeni bağımlılık eklemek tek yer."
      - "Tip property'ye de yazılır (örtük typed property kazancı)."
    risks:
      - "Property'nin docblock'unda sınıf dışından okunan bir ek açıklama varsa taşınmalı. Tarayıcı yalnız property adı parametre adıyla aynı olan, callable tipli ya da variadic olmayan atamaları önerir; property üst sınıftan geliyorsa promotion derleme hatası verir — uygulamadan önce kontrol edilir."
    before: |
      private $client;
      public function __construct(HttpClient $client) { $this->client = $client; }
    after: |
      public function __construct(private HttpClient $client) {}
    ref: "https://wiki.php.net/rfc/constructor_promotion"
    rector: "Rector\\Php80\\Rector\\Class_\\ClassPropertyAssignToConstructorPromotionRector"

  - key: sensitive_parameter
    since: "8.2"
    kind: mechanical
    unit: file
    auto: true
    sp_unit: 1
    title: "Parola / token parametresine #[\\SensitiveParameter]"
    summary: "Bu öznitelikli parametrelerin değeri stack trace'lerde ve hata loglarında gizlenir; parola/token New Relic'e ve loglara sızmaz."
    advantages:
      - "Kimlik bilgisi sızıntısı riski azalır (hata izleri New Relic'e gidiyor)."
      - "Davranış değişmez; yalnız hata çıktısı maskelenir."
    risks:
      - "Yok."
    before: "public function login(string $user, string $password)"
    after: "public function login(string $user, #[\\SensitiveParameter] string $password)"
    ref: "https://wiki.php.net/rfc/redact_parameters_in_back_traces"
    fixer: "tempo"  # Rector'un AddSensitiveParameterAttributeRector'ı kaldırıldı
  - key: typed_class_constants
    since: "8.3"
    kind: mechanical
    unit: file
    auto: true
    sp_unit: 1
    title: "Tipsiz sınıf sabiti → tipli sabit (const string X)"
    summary: "PHP 8.3 sınıf sabitlerine tip verilmesine izin verir; alt sınıfın sabiti yanlış tiple ezmesi engellenir."
    advantages:
      - "Sözleşme açık; alt sınıflarda tip uyuşmazlığı derleme hatası olur."
    risks:
      - "Alt sınıf aynı sabiti başka tiple eziyorsa artık hata verir — kalıtımla ezilen sabitler kontrol edilmeli."
    before: "const MAX_RETRY = 3;"
    after: "const int MAX_RETRY = 3;"
    ref: "https://wiki.php.net/rfc/typed_class_constants"
    rector: "Rector\\Php83\\Rector\\ClassConst\\AddTypeToConstRector"
  - key: new_without_parens
    since: "8.4"
    kind: mechanical
    unit: file
    auto: true
    sp_unit: 1
    title: "(new Foo())->bar() → new Foo()->bar()"
    summary: "PHP 8.4'te new ifadesi parantezle sarılmadan doğrudan zincirlenebilir."
    advantages:
      - "Daha az parantez, okunur zincir."
    risks:
      - "Yok — argüman parantezi zorunlu: `new Foo->bar()` değil `new Foo()->bar()`."
    before: "$total = (new Cart($items))->total();"
    after: "$total = new Cart($items)->total();"
    ref: "https://wiki.php.net/rfc/new_without_parentheses"
    rector: "Rector\\Php84\\Rector\\MethodCall\\NewMethodCallWithoutParenthesesRector"
  # ── structural: tasarım kararı, insan onayı ──
  - key: typed_properties
    since: "7.4"
    kind: structural
    unit: module
    auto: false
    sp_unit: 5
    title: "Tipsiz property'ler → tipli property"
    summary: "Sınıf alanları tip olmadan tanımlı; tip yalnız docblock'ta ya da hiç yok. Yanlış tipte atama sessizce kabul ediliyor."
    advantages:
      - "Yanlış tip atandığı anda TypeError: hata üretildiği yerde yakalanır, 3 çağrı sonra 'Undefined array key' olarak değil."
      - "IDE ve PHPStan/Sonar sınıfı anlar; otomatik tamamlama ve ölü kod analizi çalışır."
      - "Opcache/JIT tipli property'de daha az tür denetimi yapar."
      - "Sonraki adımların (readonly, promotion, property hooks) ön koşulu."
    risks:
      - "null atanan yerler ?Type ister; başlangıç değeri verilmeyen tipli property okunursa 'must not be accessed before initialization' hatası — her sınıfta atama yolları incelenmeli. Bu yüzden insan kararı."
    before: |
      class Order {
          public $id;
          protected $lines = [];
          private $total;
      }
    after: |
      class Order {
          public int $id;
          /** @var OrderLine[] */
          protected array $lines = [];
          private ?Money $total = null;
      }
    ref: "https://wiki.php.net/rfc/typed_properties_v2"
    rector: "Rector\\TypeDeclaration\\Rector\\Property\\TypedPropertyFromAssignsRector"
  - key: enum
    since: "8.1"
    kind: structural
    unit: module
    auto: false
    sp_unit: 5
    title: "Sabit grubu sınıfı → backed enum"
    summary: "Durum/tip değerleri bir sınıftaki const'larla tutuluyor; metot imzaları string/int alıyor, geçersiz değer derleme zamanında yakalanmıyor."
    advantages:
      - "Parametre tipi Status olur: geçersiz değer fonksiyona giremez, string typo biter."
      - "match ile eksiksizlik: yeni bir durum eklendiğinde ele alınmayan yer UnhandledMatchError ile görünür."
      - "Status::from('paid') / tryFrom() ile DB/API değerleri tek yerden doğrulanır."
      - "Davranış enum'a taşınır (label(), isFinal()) — dağınık if/switch toplanır."
    risks:
      - "Dış API/DB string bekler: ->value ile geçiş, tüm çağrı noktaları güncellenmeli. Sabit sınıfı başka repolardan kullanılıyorsa geçiş adım adım (önce enum + eski sabitler korunur)."
    before: |
      class OrderStatus {
          const PAID = 'paid';
          const REFUND = 'refund';
      }
      function label(string $status): string { … }
    after: |
      enum OrderStatus: string {
          case Paid = 'paid';
          case Refund = 'refund';
          public function label(): string { return match($this) { self::Paid => 'Ödendi', self::Refund => 'İade' }; }
      }
      function label(OrderStatus $status): string { return $status->label(); }
    ref: "https://wiki.php.net/rfc/enumerations"
  - key: dto_from_array
    since: "8.1"
    kind: structural
    unit: module
    auto: false
    sp_unit: 5
    title: "Dizi şekli döndüren metotlar → readonly DTO / value object"
    summary: "Metotlar ['id' => …, 'status' => …] gibi anahtarlı dizi döndürüyor; sözleşme docblock'ta bile yok. Tüketen taraf anahtar adını tahmin ediyor."
    advantages:
      - "'Undefined array key' sınıfı hataların kök nedeni kalkar: alan yoksa derleme/analiz hatası, çalışma zamanı uyarısı değil. (New Relic'ten açılan son kalite işlerinin tamamı bu sınıftandı.)"
      - "IDE alanları gösterir; yeniden adlandırma güvenli."
      - "readonly ile değiştirilemezlik: dizi yolda sessizce mutasyona uğramaz."
      - "Serileştirme tek yerde (toArray/JsonSerializable)."
    risks:
      - "Tüketen tüm yerler değişir; JSON çıktısı korunmalı (JsonSerializable). Büyük iş — modül başına kademeli, insan kapsam belirler."
    before: |
      /** @return array */
      public function toRow(): array { return ['id' => $this->id, 'status' => $this->status, 'total' => $this->total]; }
    after: |
      final readonly class OrderRow implements \JsonSerializable {
          public function __construct(public int $id, public OrderStatus $status, public Money $total) {}
          public function jsonSerialize(): array { return ['id' => $this->id, 'status' => $this->status->value, 'total' => $this->total->amount]; }
      }
      public function toRow(): OrderRow { … }
    ref: "https://wiki.php.net/rfc/readonly_properties_v2"
  - key: property_hooks
    since: "8.4"
    kind: structural
    unit: module
    auto: false
    sp_unit: 5
    title: "Getter/setter çiftleri → property hooks"
    summary: "Private alan + getX()/setX() çiftleri gövdesi basit (döndür / ata / küçük doğrulama)."
    advantages:
      - "Sınıf başına onlarca satır boilerplate kalkar; alan doğrudan $obj->x olarak okunur, doğrulama hook'ta kalır."
      - "Arayüzde property tanımlanabilir (interface'te public string $x { get; })."
    risks:
      - "Public API değişir ($o->getX() → $o->x); çağrı noktaları ve alt sınıflar güncellenmeli. Framework (ORM/serializer) getter bekliyorsa uygulanmaz — insan kararı."
    before: |
      private string $sku;
      public function getSku(): string { return $this->sku; }
      public function setSku(string $v): void { $this->sku = strtoupper($v); }
    after: |
      public string $sku { set => strtoupper($value); }
    ref: "https://wiki.php.net/rfc/property-hooks"
  - key: asymmetric_visibility
    since: "8.4"
    kind: structural
    unit: module
    auto: false
    sp_unit: 3
    title: "private alan + public getter (setter yok) → public private(set)"
    summary: "Alan dışarıdan yalnız okunuyor; bunun için getter yazılmış."
    advantages:
      - "Getter silinir, alan doğrudan okunur, yazma hâlâ sınıf içinde kalır."
      - "readonly'den esnek: sınıf içi yeniden atama serbest."
    risks:
      - "Public API değişir; property_hooks ile aynı kapsam kararı."
    before: |
      private int $count;
      public function getCount(): int { return $this->count; }
    after: |
      public private(set) int $count;
    ref: "https://wiki.php.net/rfc/asymmetric-visibility-v2"
  - key: attributes
    since: "8.0"
    kind: structural
    unit: module
    auto: false
    sp_unit: 3
    title: "Docblock anotasyonları → attribute"
    summary: "Yönlendirme, doğrulama, test sağlayıcı gibi meta veriler yorum satırında (@Route, @Assert, @dataProvider)."
    advantages:
      - "Derleyici doğrular: yanlış yazılmış anotasyon sessizce yok sayılmaz."
      - "IDE 'kullanımları bul' ve yeniden adlandırma çalışır."
      - "PHPUnit 10+ docblock anotasyonlarını kaldırıyor (#[DataProvider], #[Test])."
    risks:
      - "Kullanılan framework/kütüphane sürümünün attribute desteği doğrulanmalı; aksi halde anotasyon işlevini kaybeder."
    before: |
      /** @dataProvider skuProvider */
      public function testNormalize(string $in): void
    after: |
      #[DataProvider('skuProvider')]
      public function testNormalize(string $in): void
    ref: "https://wiki.php.net/rfc/attributes_v2"

  - key: readonly_class
    since: "8.2"
    kind: structural
    unit: file
    auto: false
    sp_unit: 2
    title: "Tüm property'leri readonly sınıf → readonly class"
    summary: "Her property'si readonly olan değer nesnesi sınıf düzeyinde readonly yapılır; yeni eklenen property de kendiliğinden readonly olur."
    advantages:
      - "Değişmezlik sınıf sözleşmesi olur; ileride eklenen alanda unutulmaz."
    risks:
      - "readonly sınıf yalnız readonly sınıflarca genişletilebilir ve dinamik/statik property alamaz — sınıfı genişleten kod varsa kırılır."
    before: "final class Money {\n    public function __construct(public readonly int $amount, public readonly string $cur) {}\n}"
    after: "final readonly class Money {\n    public function __construct(public int $amount, public string $cur) {}\n}"
    ref: "https://wiki.php.net/rfc/readonly_classes"
  # ── report-only: iş açılmaz, repo kartında gösterilir ──
  - key: strict_types
    since: "7.0"
    kind: report
    unit: file
    auto: false
    sp_unit: 0
    title: "declare(strict_types=1) kapsamı"
    summary: "Dosya başında strict_types yoksa skaler tipler sessizce dönüştürülür ('12abc' → 12)."
    advantages:
      - "Yanlış tip çağrı anında TypeError; tipli property/parametre kazanımı ancak bununla tamamlanır."
