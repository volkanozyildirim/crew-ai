# =============================================================================
# LLM Profiles — agent-LLM eslesmesi
#
# Cozumleme onceligi:
#   1. CREW_LLM_PROFILE_<AGENT_KEY_UPPER>  env override (orn:
#      CREW_LLM_PROFILE_SENIOR_DEVELOPER=developer_cli)
#   2. agents.yaml icindeki `llm_profile:` alani
#   3. Bu dosyadaki `agent_defaults` mapping'i
#   4. Geriye uyumluluk: CREW_USE_LOCAL_LLM / CREW_LOCAL_DEVELOPER env'leri
#
# Provider ekleme: src/agile_sdlc_crew/llm/providers/ altina yeni modul yaz,
# registry._bootstrap_builtin_providers icine ekle.
# =============================================================================

profiles:
  # ── Premium (high-quality, cloud) ─────────────────────────────
  architect_premium:
    provider: litellm
    model: vertex_ai/claude-sonnet-4-6
    max_tokens: 32768

  developer_premium:
    provider: litellm
    model: vertex_ai/claude-sonnet-4-6
    max_tokens: 8192

  reviewer_premium:
    provider: litellm
    model: vertex_ai/claude-sonnet-4-6
    max_tokens: 16384

  # ── Reasoning (orta seviye, cloud) ────────────────────────────
  reasoning_remote:
    provider: litellm
    model: o4-mini
    max_tokens: 4096

  scrum_remote:
    provider: litellm
    model: o4-mini
    max_tokens: 2048

  # ── Local (Ollama) ────────────────────────────────────────────
  reasoning_local:
    provider: ollama
    model: qwen3:8b
    max_tokens: 4096

  scrum_local:
    provider: ollama
    model: qwen3:8b
    max_tokens: 2048

  developer_local_coder:
    provider: ollama
    model: qwen2.5-coder:7b
    max_tokens: 8192
    base_url_env: OLLAMA_CODER_BASE_URL  # coder modeli farkli sunucudaysa

  kickoff_local:
    provider: ollama
    model: qwen3:8b
    max_tokens: 4096

  # ── Claude CLI (OAuth, API key gerektirmez) ───────────────────
  developer_cli:
    provider: claude_cli
    model: sonnet
    max_tokens: 8192

  architect_cli:
    provider: claude_cli
    model: opus
    max_tokens: 32768

  reasoning_cli:
    provider: claude_cli
    model: sonnet
    max_tokens: 4096

  # ── Ucuz CLI alternatifleri (maliyet optimizasyonu — OPT-IN) ──────
  # Default DEGIL. Maliyeti dusurmek isteyen, architect/reviewer'i Opus yerine
  # Sonnet'e cekmek icin env ile secer (kod degisikligi yok):
  #   CREW_LLM_PROFILE_SOFTWARE_ARCHITECT=architect_cli_sonnet
  #   CREW_LLM_PROFILE_CODE_REVIEWER=reviewer_cli
  # NOT: "premium remote" invariant'i korunur (Sonnet de premium; LOCAL degil).
  # Sonnet plan/review kalitesi Opus'tan dusuk olabilir → bir WI ile dogrula.
  architect_cli_sonnet:
    provider: claude_cli
    model: sonnet
    max_tokens: 32768

  reviewer_cli:
    provider: claude_cli
    model: sonnet
    max_tokens: 16384

  # ── Angarya fazlari (VARSAYILAN sonnet — karar veren fazlar opus kalir) ──
  # Olculdu (222 mimar cagrisi / 26 is, technical_design_task $80.60):
  #   KESIF  29 cagri  %43 para  $1.186/cagri
  #   kucuk  137 cagri %42 para  $0.247/cagri
  #   plan   39 cagri  %15 para  $0.318/cagri
  # Kesif fazi dosya okur / grep atar / ozetler — muhakeme URETMEZ, plani
  # _architect_emit_json yazar ve o opus kalir. Ayni mantik kickoff icin: o
  # adim baglayici teknik artefakt degil, ekibe gosterilen kilavuz uretir.
  #
  # Kesfin pahali olmasinin sebebi BAGLAM BOYUTU DEGIL, TUR SAYISI. Bir
  # llm_calls satiri tek istek degil tek `claude -p` oturumu; token'lar tum
  # turlarin toplami. 29 kesif cagrisinin anatomisi:
  #   girdi           161K  %0.8
  #   onbellek YAZMA  1.42M %7.2
  #   onbellek OKUMA  18.2M %92.0   <- her turda TEKRAR okunan prefix
  #   450 tur (cagri basina 15.5) → TUR BASINA ~44K, bunun ~40K'si onbellek okuma
  # Yani gercek istek baglami ~44K; hicbir modelin penceresini zorlamaz. Maliyet
  # 15.5 turun her birinde ~44K'lik prefix'i yeniden okumaktan geliyor.
  # Ucuzlatmanin yolu: tur sayisini ya da prefix'i kucultmek.
  # Geri almak: CREW_LLM_PROFILE_SOFTWARE_ARCHITECT_EXPLORE=architect_cli
  architect_explore_cli:
    provider: claude_cli
    model: sonnet
    max_tokens: 32768

  kickoff_cli:
    provider: claude_cli
    model: sonnet
    max_tokens: 16384

  # ── Anthropic API (direkt) ────────────────────────────────────
  developer_anthropic:
    provider: anthropic
    model: claude-sonnet-4-20250514
    max_tokens: 8192

  # Kickoff agent ciktilarini puanlayan hizli/ucuz Haiku grader.
  # CREW_KICKOFF_GRADING=1 ise scrum master rolunde her kickoff
  # ciktisini 1-10 araliginda skorlar; <8 ise iyilestirilmis prompt ile retry.
  # claude_cli (subprocess, API key gerekmez) — projedeki diger agentlarla
  # ayni OAuth oturumunu kullanir. Grader Haiku, agent'lar Sonnet/Opus.
  kickoff_grader:
    provider: claude_cli
    model: haiku
    max_tokens: 2048


# Agent → default profile.
# CREW_USE_LOCAL_LLM=1 ise resolver otomatik olarak `*_local` veya
# developer_local_coder'a duser; bu mapping bu fallback yokken kullanilir.
agent_defaults:
  software_architect: architect_premium
  senior_developer: developer_premium
  business_analyst: reasoning_remote
  qa_engineer: reasoning_remote
  uat_specialist: reasoning_remote
  code_reviewer: reasoning_remote
  scrum_master: scrum_remote
  product_owner: reasoning_remote
  # Angarya fazlari — agent_llm_overrides.yaml'a BILEREK yazilmadi: oradaki
  # kayit dashboard'un yonettigi "insan karari" katmani; bunlarin sonnet olmasi
  # bir tercih degil olculmus varsayilan. Dashboard'dan yine degistirilebilir
  # (server._AGENT_KEYS'e kayitlilar) — o zaman override katmani devralir.
  software_architect_explore: architect_explore_cli
  software_architect_kickoff: kickoff_cli
  senior_developer_kickoff: kickoff_cli
